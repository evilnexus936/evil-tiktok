
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>EVIL NEXUS | PHANTOM V4</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #00ff66;
    font-family: monospace;
    min-height: 100vh;
    overflow-x: hidden;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: .35;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 1;
    width: 92%;
    max-width: 850px;
    margin: 65px auto;
    padding: 25px;
    border: 1px solid #00ff66;
    background: rgba(0,0,0,.88);
    box-shadow: 0 0 25px #00ff6633;
}

h1 {
    text-align: center;
    font-size: clamp(28px, 7vw, 48px);
    letter-spacing: 7px;
    text-shadow: 0 0 15px #00ff66;
    animation: glitch 3s infinite;
}

.subtitle {
    text-align: center;
    margin: 15px 0 30px;
    color: #8affb2;
    letter-spacing: 4px;
}

.status {
    border-top: 1px solid #00ff6644;
    border-bottom: 1px solid #00ff6644;
    padding: 18px 0;
    line-height: 2;
    font-size: 13px;
}

.status span {
    color: white;
}

.online {
    color: #00ff66;
    text-shadow: 0 0 10px #00ff66;
}

.terminal {
    margin-top: 25px;
    border: 1px solid #00ff66;
    padding: 15px;
    background: #020702;
}

.terminal h3 {
    margin-bottom: 15px;
    letter-spacing: 3px;
}

#output {
    height: 210px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 12px;
    color: #8affb2;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    min-width: 0;
    flex: 1;
    padding: 12px;
    background: black;
    border: 1px solid #00ff66;
    color: #00ff66;
    outline: none;
    font-family: monospace;
}

button {
    padding: 12px 18px;
    background: #00ff66;
    color: black;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: white;
    box-shadow: 0 0 15px #00ff66;
}

.footer {
    text-align: center;
    margin-top: 30px;
    font-size: 11px;
    color: #477b55;
    letter-spacing: 2px;
}

@keyframes glitch {
    0%, 90%, 100% { transform: translate(0); }
    92% { transform: translate(2px,-1px); }
    94% { transform: translate(-2px,1px); }
    96% { transform: translate(1px,1px); }
}

@media(max-width: 500px) {
    .container {
        padding: 16px;
        margin: 30px auto;
    }

    .input-area {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<main class="container">

    <h1>PHANTOM</h1>

    <div class="subtitle">
        EVIL NEXUS // PROTOCOL V4
    </div>

    <section class="status">
        <p>IDENTITY: <span>CLASSIFIED</span></p>
        <p>MODE: <span>PHANTOM</span></p>
        <p>SECURITY: <span class="online">ACTIVE</span></p>
        <p>SYSTEM: <span class="online">ONLINE</span></p>
        <p>VERSION: <span>4.0.0</span></p>
    </section>

    <section class="terminal">
        <h3>ROOT TERMINAL</h3>

        <div id="output">
PHANTOM SYSTEM INITIALIZED.
WELCOME TO EVIL NEXUS.

Type "help" to see available commands.

        </div>

        <div class="input-area">
            <input
                id="command"
                type="text"
                placeholder="Enter command..."
                autocomplete="off"
            >

            <button onclick="executeCommand()">
                EXECUTE
            </button>
        </div>
    </section>

    <div class="footer">
        EVIL NEXUS © 2026 // PHANTOM V4
    </div>

</main>

<script>
// MATRIX DIGITAL RAIN

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const characters = "01アイウエオカキクケコサシスセソ";
let drops = [];
let fontSize = 14;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const columns = Math.ceil(canvas.width / fontSize);
    drops = Array(columns).fill(1);
}

function drawMatrix() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const char = characters[
            Math.floor(Math.random() * characters.length)
        ];

        ctx.fillText(
            char,
            i * fontSize,
            drops[i] * fontSize
        );

        if (
            drops[i] * fontSize > canvas.height &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
setInterval(drawMatrix, 40);


// TERMINAL INTERACTIVE

const output = document.getElementById("output");
const input = document.getElementById("command");

function printLine(text) {
    output.textContent += "\n" + text;
    output.scrollTop = output.scrollHeight;
}

function executeCommand() {
    const command = input.value.trim().toLowerCase();

    if (!command) return;

    printLine("\nroot@phantom:~$ " + command);

    switch (command) {

        case "help":
            printLine(`
AVAILABLE COMMANDS:

help      - Show commands
status    - System status
identity  - Phantom identity
phantom   - Initialize protocol
clear     - Clear terminal
version   - Show version
about     - About Evil Nexus
`);
            break;

        case "status":
            printLine(`
[ SYSTEM STATUS ]

SYSTEM: ONLINE
SECURITY: ACTIVE
PROTOCOL: PHANTOM V4
MODE: OPERATIONAL
`);
            break;

        case "identity":
            printLine(`
[ IDENTITY ]

NAME: PHANTOM
CREATOR: EVIL NEXUS
IDENTITY: CLASSIFIED
ACCESS: LOCAL TERMINAL
`);
            break;

        case "phantom":
            printLine(`
INITIALIZING PHANTOM PROTOCOL...

[ OK ] SYSTEM INITIALIZED
[ OK ] INTERFACE LOADED
[ OK ] PROTOCOL ACTIVE

PHANTOM V4 READY.
`);
            break;

        case "version":
            printLine("PHANTOM V4.0.0");
            break;

        case "about":
            printLine(`
EVIL NEXUS
A DIGITAL EXPERIMENT.
PROTOCOL: PHANTOM V4.
`);
            break;

        case "clear":
            output.textContent = "TERMINAL CLEARED.\n";
            break;

        default:
            printLine("UNKNOWN COMMAND: " + command);
            printLine('Type "help" for available commands.');
    }

    input.value = "";
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        executeCommand();
    }
});
</script>

</body>
</html>
