<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVIL NEXUS | PHANTOM V4</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:#00ff66;
 font-family:monospace;overflow-x:hidden;
 min-height:100vh;
}
canvas{
 position:fixed;inset:0;
 width:100%;height:100%;
 z-index:-1;opacity:.35;
}
main{
 width:92%;max-width:650px;
 margin:50px auto;padding:25px;
 background:#020805ed;
 border:1px solid #00ff66;
 box-shadow:0 0 25px #00ff6655;
}
h1{
 text-align:center;font-size:35px;
 letter-spacing:5px;
 animation:glitch 2s infinite;
}
@keyframes glitch{
 0%,90%,100%{text-shadow:0 0 10px #00ff66}
 92%{text-shadow:3px 0 red,-3px 0 cyan}
 95%{transform:translateX(2px)}
}
.center{text-align:center;letter-spacing:3px}
.line{border-top:1px solid #00ff6655;margin:20px 0}
.status{color:#00ff99}
.terminal{
 background:#000;padding:15px;
 border:1px solid #087b3c;
 min-height:180px;line-height:1.8;
 overflow-wrap:anywhere;
}
input{
 width:100%;background:#000;
 border:1px solid #00ff66;
 color:#00ff66;padding:13px;
 font-family:monospace;margin-top:12px;
 outline:none;
}
button{
 width:100%;padding:12px;
 margin-top:10px;background:#00ff66;
 border:0;color:#000;font-weight:bold;
 font-family:monospace;
}
.footer{text-align:center;font-size:11px;margin-top:25px}
</style>
</head>

<body>
<canvas id="matrix"></canvas>

<main>
<h1>EVIL NEXUS</h1>
<div class="center">PHANTOM PROTOCOL // V4</div>

<div class="line"></div>

<p class="status">● SYSTEM ONLINE</p>
<p>IDENTITY: CLASSIFIED</p>
<p>MODE: PHANTOM</p>
<p>SECURITY: ACTIVE</p>

<div class="line"></div>

<div class="terminal" id="terminal">
> PHANTOM SYSTEM INITIALIZED<br>
> WAITING FOR COMMAND...
</div>

<input id="command" placeholder="Digite um comando...">
<button onclick="runCommand()">EXECUTE</button>

<div class="footer">
EVIL NEXUS © 2026<br>
GHOST PROTOCOL // DIGITAL SHADOW
</div>
</main>

<script>
// MATRIX VISUAL
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
let drops=[];

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
 drops=Array(Math.floor(canvas.width/16)).fill(1);
}
resize();
window.addEventListener("resize",resize);

function draw(){
 ctx.fillStyle="rgba(0,0,0,.08)";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#00ff66";
 ctx.font="15px monospace";

 drops.forEach((y,i)=>{
  const char=String.fromCharCode(0x30A0+Math.random()*96);
  ctx.fillText(char,i*16,y*16);
  if(y*16>canvas.height&&Math.random()>.975)drops[i]=0;
  drops[i]++;
 });
}
setInterval(draw,50);

// TERMINAL
function runCommand(){
 const input=document.getElementById("command");
 const terminal=document.getElementById("terminal");
 const cmd=input.value.trim().toLowerCase();

 const commands={
  help:"COMANDOS: help, status, identity, phantom, clear",
  status:"SYSTEM ONLINE // ALL VISUAL SYSTEMS ACTIVE",
  identity:"IDENTITY: EVIL NEXUS // PHANTOM",
  phantom:"GHOST PROTOCOL V4 INITIALIZED",
  clear:""
 };

 if(cmd==="clear"){
  terminal.innerHTML="> TERMINAL CLEARED";
 }else{
  terminal.innerHTML+="<br>> "+escapeHTML(cmd)+"<br>"+(commands[cmd]||"COMMAND NOT FOUND. TYPE HELP.");
 }
 input.value="";
 terminal.scrollTop=terminal.scrollHeight;
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

document.getElementById("command").addEventListener("keydown",e=>{
 if(e.key==="Enter")runCommand();
});
</script>
</body>
</html>
