<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVIL NEXUS | GHOST PROTOCOL</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020403;color:#00ff66;
 font-family:monospace;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 padding:20px;
}
.container{
 width:100%;max-width:650px;
 border:1px solid #00ff66;
 padding:25px;box-shadow:0 0 30px #00ff6633;
 background:#030805;
}
h1{
 text-align:center;font-size:35px;
 text-shadow:0 0 15px #00ff66;
 letter-spacing:5px;
}
.subtitle{text-align:center;letter-spacing:4px}
.line{border-top:1px solid #00ff6655;margin:20px 0}
.status{color:#00ff99}
.terminal{
 background:#000;padding:18px;
 border:1px solid #087b3c;
 min-height:220px;line-height:1.8;
 overflow-wrap:anywhere;
}
.cursor{animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.bar{
 height:5px;background:#123;
 margin-top:20px;overflow:hidden
}
.progress{
 height:100%;width:0;background:#00ff66;
 animation:load 4s infinite;
}
@keyframes load{
 0%{width:0}80%{width:100%}100%{width:100%}
}
.footer{text-align:center;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<div class="container">
<h1>EVIL NEXUS</h1>
<div class="subtitle">GHOST PROTOCOL // V3</div>
<div class="line"></div>
<p class="status">● SYSTEM ONLINE</p>
<p>IDENTITY: CLASSIFIED</p>
<p>MODE: PHANTOM</p>
<p>SECURITY: ACTIVE</p>
<div class="line"></div>
<div class="terminal">
<div id="terminal"></div>
<span class="cursor">█</span>
</div>
<div class="bar"><div class="progress"></div></div>
<div class="footer">
EVIL NEXUS © 2026<br>
DIGITAL SHADOW // GHOST PROTOCOL
</div>
</div>
<script>
const lines=[
"> INITIALIZING GHOST PROTOCOL...",
"> LOADING PHANTOM INTERFACE...",
"> ESTABLISHING SECURE SESSION...",
"> ENCRYPTION: ACTIVE",
"> IDENTITY: EVIL NEXUS",
"> SYSTEM STATUS: ONLINE",
"> ACCESS: AUTHORIZED",
"> WELCOME TO THE VOID."
];
let i=0;
const terminal=document.getElementById("terminal");
function typeLine(){
 if(i>=lines.length){
  setTimeout(()=>{terminal.innerHTML="";i=0;typeLine()},3000);
  return;
 }
 terminal.innerHTML+=lines[i]+"<br>";
 i++;
 setTimeout(typeLine,850);
}
typeLine();
</script>
</body>
</html>
